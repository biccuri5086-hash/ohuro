name: 開発タスク
description: Claude Code に実装させるタスク（人間が status:approved を付けるまで着手しない）
labels: []
body:
  - type: input
    id: gate
    attributes:
      label: 対象 Gate
      placeholder: "Gate 2"
    validations:
      required: true
  - type: textarea
    id: goal
    attributes:
      label: 目的
      description: 入浴開始の支援にどうつながるか
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: 受け入れ条件
      description: 検証可能な条件を箇条書きで
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: 範囲外（やらないこと）
  - type: textarea
    id: refs
    attributes:
      label: 関連する要件ID・文書
      placeholder: "BATH-1, PRODUCT_REQUIREMENTS.md"
