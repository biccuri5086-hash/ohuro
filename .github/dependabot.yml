version: 2
updates:
  - package-ecosystem: npm
    directory: /
    target-branch: main
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # typescript-eslint の対応範囲が typescript <6.1.0 のため（D-003）。対応後に解除する
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      # 実行環境は Node 22（.nvmrc）。型定義のメジャーは実行環境に合わせる
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    target-branch: main
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
