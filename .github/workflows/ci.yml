name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "claude/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test
      - name: Secret scan
        run: npm run check:secrets
      - name: Policy check
        run: npm run check:policy
      - name: Migration check
        run: npm run check:migrations
      - name: Build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

  dependency-audit:
    name: dependency-audit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      # D-006: 本番依存（dependencies）の high 以上はマージを止める。
      - name: npm audit 本番依存（high 以上で失敗）
        run: npm audit --omit=dev --audit-level=high
      # D-006: 開発依存を含む全体は結果を表示するが、マージは止めない。
      # 修正版が未公開の脆弱性で全 PR が止まることを避けるため。結果は人間が確認し、対応を判断する。
      - name: npm audit 全依存（報告のみ）
        continue-on-error: true
        run: |
          {
            echo "## npm audit（開発依存を含む・報告のみ）"
            echo '```'
            npm audit --audit-level=high || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          npm audit --audit-level=high
