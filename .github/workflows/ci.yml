name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "claude/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test
      - name: Secret scan
        run: npm run check:secrets
      - name: Policy check
        run: npm run check:policy
      - name: Migration check
        run: npm run check:migrations
      - name: Build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

  db-test:
    name: db-test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # 実 PostgreSQL（Supabase の本番と同じ 17 系）でマイグレーション・権限・RLS を検証する。本番 DB には接続しない
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: ohuro_ci
          POSTGRES_PASSWORD: ohuro_ci
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ohuro_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: DB tests
        run: npm run test:db
        env:
          TEST_DATABASE_URL: postgres://ohuro_ci:ohuro_ci@127.0.0.1:5432/postgres

  e2e:
    name: e2e
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # LP〜事前登録〜確認〜解除〜計測の通し確認（Issue #16）。Android Chrome 相当・iPhone 画面サイズ（Chromium）・iPhone Safari 相当（WebKit）
    # 本番の DB やメール送信には接続しない（E2E 専用 DB と outbox を使う）
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: ohuro_ci
          POSTGRES_PASSWORD: ohuro_ci
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ohuro_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Install browsers
        run: npx playwright install --with-deps chromium webkit
      - name: E2E tests
        run: npm run test:e2e
        env:
          TEST_DATABASE_URL: postgres://ohuro_ci:ohuro_ci@127.0.0.1:5432/postgres
          E2E_WEBKIT: "1"
          NEXT_TELEMETRY_DISABLED: "1"

  dependency-audit:
    name: dependency-audit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      # D-006: 本番依存（dependencies）の high 以上はマージを止める。
      - name: npm audit 本番依存（high 以上で失敗）
        run: npm audit --omit=dev --audit-level=high
      # D-006: 開発依存を含む全体は結果を表示するが、マージは止めない。
      # 修正版が未公開の脆弱性で全 PR が止まることを避けるため。結果は人間が確認し、対応を判断する。
      - name: npm audit 全依存（報告のみ）
        continue-on-error: true
        run: |
          {
            echo "## npm audit（開発依存を含む・報告のみ）"
            echo '```'
            npm audit --audit-level=high || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          npm audit --audit-level=high
